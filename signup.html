<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up – Planberry</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#e63e79" />
  <link rel="icon" href="icon-192.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script>
    try {
      var theme = localStorage.getItem("theme") ||
        (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-bs-theme", theme);
    } catch (e) {}
  </script>
</head>
<body>
  <div class="auth-card card mx-auto mt-5">
    <div class="card-body p-4">
      <h1 class="text-center mb-1"><a href="landing.html" class="text-reset text-decoration-none">Planberry</a></h1>
      <p class="text-center text-body-secondary mb-4">Create your account</p>

      <div id="Auth-error" class="alert alert-danger py-2 d-none"></div>

      <form id="Signup-form">
        <label for="Name" class="form-label small mb-1">Name</label>
        <input id="Name" name="name" type="text" class="form-control mb-3" placeholder="Your name" autocomplete="name" required />

        <label for="Email" class="form-label small mb-1">Email</label>
        <input id="Email" name="email" type="email" class="form-control mb-3" placeholder="you@example.com" autocomplete="email" required />

        <label for="Password" class="form-label small mb-1">Password</label>
        <input id="Password" name="password" type="password" class="form-control mb-3" placeholder="At least 6 characters" autocomplete="new-password" required />

        <label for="Confirm" class="form-label small mb-1">Confirm password</label>
        <input id="Confirm" name="confirm" type="password" class="form-control mb-4" placeholder="Type it again" autocomplete="new-password" required />

        <button type="submit" class="btn btn-primary w-100">Sign up</button>
      </form>

      <p class="text-center small mt-3 mb-0">Already have an account? <a href="login.html" class="brand-pink">Log in</a></p>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    if (Planberry.currentUser()) window.location.replace("index.html");

    setupAuthForm("Signup-form", async function (data) {
      if (data.get("password") !== data.get("confirm")) {
        throw new Error("The passwords don't match.");
      }
      await Planberry.signUp(data.get("name"), data.get("email"), data.get("password"));
    });
  </script>
</body>
</html>
