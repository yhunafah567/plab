<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings – Planberry</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#e63e79" />
  <link rel="icon" href="icon-192.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script>
    try {
      var theme = localStorage.getItem("theme") ||
        (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-bs-theme", theme);
    } catch (e) {}
  </script>
  <script src="auth.js"></script>
  <script>
    if (!Planberry.currentUser()) window.location.replace("login.html");
  </script>
</head>
<body>
  <a href="index.html" class="brand-pink small text-decoration-none">← Back to my tasks</a>
  <h1 class="mt-2">Settings</h1>
  <p class="text-body-secondary">Logged in as <strong id="Account-email"></strong></p>

  <!-- Change name -->
  <div class="card mb-3">
    <div class="card-body">
      <h5 class="card-title">Your name</h5>
      <form id="Name-form">
        <div class="alert py-2 d-none" data-message></div>
        <input id="New-name" name="name" type="text" class="form-control mb-3" autocomplete="name" required />
        <button type="submit" class="btn btn-primary">Save name</button>
      </form>
    </div>
  </div>

  <!-- Change password -->
  <div class="card mb-3">
    <div class="card-body">
      <h5 class="card-title">Change password</h5>
      <form id="Password-form">
        <div class="alert py-2 d-none" data-message></div>
        <label for="Current-password" class="form-label small mb-1">Current password</label>
        <input id="Current-password" name="current" type="password" class="form-control mb-3" autocomplete="current-password" required />
        <label for="New-password" class="form-label small mb-1">New password</label>
        <input id="New-password" name="next" type="password" class="form-control mb-3" placeholder="At least 6 characters" autocomplete="new-password" required />
        <label for="Confirm-password" class="form-label small mb-1">Confirm new password</label>
        <input id="Confirm-password" name="confirm" type="password" class="form-control mb-3" autocomplete="new-password" required />
        <button type="submit" class="btn btn-primary">Change password</button>
      </form>
    </div>
  </div>

  <!-- Delete account -->
  <div class="card border-danger mb-3">
    <div class="card-body">
      <h5 class="card-title text-danger">Delete account</h5>
      <p class="small mb-3">This deletes your account and all your tasks from this device. It can't be undone.
        Tip: click "Save backup" on your tasks page first if you want to keep a copy.</p>
      <form id="Delete-form">
        <div class="alert py-2 d-none" data-message></div>
        <label for="Delete-password" class="form-label small mb-1">Type your password to confirm</label>
        <input id="Delete-password" name="password" type="password" class="form-control mb-3" autocomplete="current-password" required />
        <button type="submit" class="btn btn-danger">Delete my account</button>
      </form>
    </div>
  </div>

  <script>
    var me = Planberry.currentUser();
    if (me) {
      document.getElementById("Account-email").textContent = me.email;
      document.getElementById("New-name").value = me.name;
    }

    // Shows a green (success) or red (error) message inside a form
    function showMessage(form, text, ok) {
      var box = form.querySelector("[data-message]");
      box.textContent = text;
      box.className = "alert py-2 " + (ok ? "alert-success" : "alert-danger");
    }

    function handle(formId, action) {
      var form = document.getElementById(formId);
      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        try {
          var message = await action(new FormData(form), form);
          if (message) showMessage(form, message, true);
        } catch (e) {
          showMessage(form, e.message, false);
        }
      });
    }

    handle("Name-form", function (data) {
      Planberry.updateName(data.get("name"));
      return "Saved! Your name is now " + data.get("name").trim() + ".";
    });

    handle("Password-form", async function (data, form) {
      if (data.get("next") !== data.get("confirm")) throw new Error("The new passwords don't match.");
      await Planberry.changePassword(data.get("current"), data.get("next"));
      form.reset();
      return "Your password has been changed.";
    });

    handle("Delete-form", async function (data) {
      if (!confirm("Are you sure? Your account and all your tasks will be deleted forever.")) return;
      await Planberry.deleteAccount(data.get("password"));
      alert("Your account has been deleted.");
      window.location.href = "landing.html";
    });
  </script>
</body>
</html>
